server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: hospital-appointment

  # MySQL 配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:hospital}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

  # Flyway 配置
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  # Jackson 配置
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.hospital.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: ${JWT_SECRET:your-secret-key-change-in-production-must-be-at-least-256-bits}
  expiration: 86400000  # 24小时

# 敏感字段加密（手机号 / 身份证）：AES-256-GCM，密钥至少 32 字节
# ⚠️ 换密钥会导致已落库的密文无法解密，生产环境必须固定并单独保管
crypto:
  key: ${CRYPTO_KEY:change-me-hospital-crypto-key-32bytes!}

# 微信小程序：appid/appsecret 留空即走 mock 模式（本地开发与自动化测试用，
# 由 code 稳定派生 openid）；填上真值后 WechatService 自动改走 jscode2session。
wechat:
  appid: ${WECHAT_APPID:}
  appsecret: ${WECHAT_APPSECRET:}
  # 微信支付（T12）。真实商户对接属附录 A「首版不做」，所以这里只留占位：
  # 两项为空 => MockWechatPayService 生效（启动会打一条 WARN 喊出来，理由见该类的注释）。
  # 一旦填上真实 mchid 却没换实现类，MockWechatPayService 会直接抛 IllegalStateException——
  # 宁可启动/调用即炸，也不要"以为在收钱、其实在发假预下单号"。
  pay:
    mchid: ${WECHAT_PAY_MCHID:}
    apiv3key: ${WECHAT_PAY_APIV3KEY:}
    # 只有测试会把它设成 failure，用来确定性触发 J27「支付抛异常 => 预约与号源一起回滚」。
    mock-outcome: ${WECHAT_PAY_MOCK_OUTCOME:success}

# 日志配置
logging:
  level:
    com.hospital: debug
    org.springframework.security: debug
